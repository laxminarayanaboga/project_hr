services:
  db:
    image: postgres:17-alpine
    container_name: hrapp-db
    environment:
      POSTGRES_DB: hrapp
      POSTGRES_USER: hrapp
      POSTGRES_PASSWORD: hrapp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:11-alpine
    container_name: hrapp-flyway
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/hrapp
      FLYWAY_USER: hrapp
      FLYWAY_PASSWORD: hrapp_dev
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql
    command: migrate
    restart: "no"

  backend:
    build: ./backend
    container_name: hrapp-backend
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hrapp
      SPRING_DATASOURCE_USERNAME: hrapp
      SPRING_DATASOURCE_PASSWORD: hrapp_dev
      JWT_SECRET: dev-secret-change-in-production-must-be-at-least-256-bits-long
      AWS_REGION: eu-west-2
      S3_DOCUMENTS_BUCKET: hrapp-documents-dev
      SES_FROM_ADDRESS: noreply@hrapp.dev
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: hrapp-frontend
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8080
    ports:
      - "5173:5173"

volumes:
  postgres_data:
