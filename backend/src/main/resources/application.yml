spring:
  application:
    name: hrapp-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /

app:
  mail:
    from: ${MAIL_FROM:noreply@hrapp.dev}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000
  aws:
    region: ${AWS_REGION:eu-west-2}
    s3:
      documents-bucket: ${S3_DOCUMENTS_BUCKET}
    ses:
      from-address: ${SES_FROM_ADDRESS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
