<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leave Approved</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    .wrapper { max-width: 600px; margin: 32px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .header { background: #16a34a; padding: 24px 32px; }
    .header h1 { color: #ffffff; margin: 0; font-size: 20px; font-weight: 600; }
    .body { padding: 32px; color: #374151; }
    .body p { margin: 0 0 16px; line-height: 1.6; }
    .detail-table { width: 100%; border-collapse: collapse; margin: 24px 0; }
    .detail-table td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    .detail-table td:first-child { color: #6b7280; width: 40%; }
    .detail-table td:last-child { font-weight: 600; color: #111827; }
    .badge { display: inline-block; background: #dcfce7; color: #166534; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; }
    .footer { background: #f9fafb; padding: 16px 32px; font-size: 12px; color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>Leave Approved</h1>
  </div>
  <div class="body">
    <p>Hi <span th:text="${employeeName}">Employee</span>,</p>
    <p>Great news — your leave request has been <span class="badge">Approved</span>.</p>
    <table class="detail-table">
      <tr><td>Leave Type</td><td th:text="${leaveType}">-</td></tr>
      <tr><td>Start Date</td><td th:text="${#temporals.format(startDate,'d MMM yyyy')}">-</td></tr>
      <tr><td>End Date</td><td th:text="${#temporals.format(endDate,'d MMM yyyy')}">-</td></tr>
      <tr><td>Working Days</td><td th:text="${workingDays}">-</td></tr>
    </table>
    <p>If you have any questions, please contact your manager or HR.</p>
  </div>
  <div class="footer">This is an automated message from HRApp. Do not reply to this email.</div>
</div>
</body>
</html>
