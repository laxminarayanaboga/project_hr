plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hrapp'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion     = '0.12.6'
    mapstructVersion = '1.6.3'
    lombokVersion   = '1.18.46'
    awsSdkVersion   = '1.12.780'
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-java8time:3.0.4.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Database
    runtimeOnly  'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly  'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-flyway'

    // JWT
    implementation  "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly     "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly     "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // AWS SDK v1
    implementation "com.amazonaws:aws-java-sdk-s3:${awsSdkVersion}"
    implementation "com.amazonaws:aws-java-sdk-ses:${awsSdkVersion}"
    implementation "com.amazonaws:aws-java-sdk-secretsmanager:${awsSdkVersion}"

    // Lombok
    compileOnly         "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // MapStruct  (lombok-mapstruct-binding keeps annotation processor order correct)
    implementation      "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // PDF export
    implementation 'com.github.librepdf:openpdf:3.0.5'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly         "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
}
