name: Backend CI/CD

on:
  workflow_dispatch:
    # Auto-triggers disabled — personal account, minimise billing.
    # Enable push/pull_request triggers when ready to wire up staging deploy.

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: hrapp-backend
  ECS_SERVICE: hrapp-backend-staging
  ECS_CLUSTER: hrapp-staging

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hrapp_test
          POSTGRES_USER: hrapp
          POSTGRES_PASSWORD: hrapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn -q test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hrapp_test
          SPRING_DATASOURCE_USERNAME: hrapp
          SPRING_DATASOURCE_PASSWORD: hrapp_test
          JWT_SECRET: test-secret-minimum-256-bits-for-hmac-sha-algorithm-testing
          S3_DOCUMENTS_BUCKET: hrapp-documents-test
          SES_FROM_ADDRESS: test@hrapp.dev
          AWS_REGION: eu-west-2

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build JAR
        working-directory: backend
        run: mvn -q package -DskipTests

      - name: Build & push Docker image
        id: build-image
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION
